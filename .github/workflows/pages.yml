name: Publish

# Publishes Refill to GitHub Pages on every push to main, with the commit's
# short hash and date stamped into the app (shown at the bottom of Settings).
# Needs Settings → Pages → Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the commit into the app
        run: node scripts/stamp-version.mjs . "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cs)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
